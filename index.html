<style>
  :root {
    --bg: #050506;
    --glass: rgba(22, 22, 24, .72);
    --glass-line: rgba(255, 255, 255, .10);
    --ink: #f3efe6;
    --ink-2: rgba(243, 239, 230, .66);
    --ink-3: rgba(243, 239, 230, .45);
    --cream: #f1ece1;
    --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Helvetica Neue", Arial, sans-serif;
    --serif: "Noto Serif KR", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  body { -webkit-tap-highlight-color: transparent; }
  canvas#room { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
  canvas#room.dragging { cursor: grabbing; }
  canvas#room.over { cursor: pointer; }

  /* hover / centre card */
  #card {
    position: fixed; left: 50%; bottom: calc(46px + env(safe-area-inset-bottom)); transform: translate(-50%, 12px);
    min-width: 280px; max-width: min(420px, calc(100vw - 32px)); padding: 14px 18px 14px;
    background: var(--glass); border: 1px solid var(--glass-line); border-radius: 14px;
    backdrop-filter: blur(16px) saturate(1.2); -webkit-backdrop-filter: blur(16px) saturate(1.2);
    opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
  }
  #card.show { opacity: 1; transform: translate(-50%, 0); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 5px; background: var(--cream); color: #111; font: 700 13px/1.35 var(--sans); letter-spacing: .04em; }
  #card .t { margin: 7px 0 4px; font: 700 20px/1.25 var(--sans); }
  #card .s, .tcard .s { font: 400 13px/1.4 var(--sans); color: var(--ink-2); }

  footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
    text-align: center; font: 400 11px/1.45 var(--sans); color: rgba(243, 239, 230, .62);
    background: linear-gradient(to top, rgba(5, 5, 6, .78), rgba(5, 5, 6, 0)); pointer-events: none;
  }
  #msg { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 14px 18px; border-radius: 12px; background: var(--glass); display: none; z-index: 40; font-size: 14px; }

  /* ---------- inspect ---------- */
  #inspect {
    position: fixed; inset: 0; z-index: 20; display: none;
    background: rgba(5, 5, 6, .30);
    backdrop-filter: blur(9px) brightness(.62); -webkit-backdrop-filter: blur(9px) brightness(.62);
    opacity: 0; transition: opacity .3s;
  }
  #inspect.open { display: block; }
  #inspect.vis { opacity: 1; }
  .layout { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 22px; padding: 24px 40px 56px; }
  .panel {
    width: 388px; flex: 0 0 auto; padding: 30px 28px 26px; border-radius: 22px;
    background: linear-gradient(180deg, rgba(30, 30, 33, .78), rgba(16, 16, 18, .82));
    border: 1px solid var(--glass-line); box-shadow: 0 30px 80px rgba(0, 0, 0, .45);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  }
  .lbl { font: 700 12px/1 var(--sans); letter-spacing: .22em; color: var(--ink-2); margin: 0 0 12px; }
  .ov { font: 500 16px/1.62 var(--serif); color: var(--ink); margin: 0 0 18px; padding-bottom: 18px; border-bottom: 1px solid var(--glass-line); }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; row-gap: 11px; column-gap: 16px; }
  dt { font: 700 13px/1.5 var(--sans); letter-spacing: .2em; color: var(--ink-2); white-space: nowrap; }
  dd { margin: 0; text-align: right; font: 400 15px/1.5 var(--sans); color: var(--ink); }
  .btn { display: flex; align-items: center; justify-content: center; height: 46px; border-radius: 12px; background: var(--cream); color: #111; font: 700 16px/1 var(--sans); text-decoration: none; }
  .btn:hover { background: #fff; }
  .right .lbl + .btn { margin-bottom: 4px; }

  .stage { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .scene3d { perspective: 1400px; }
  .case { position: relative; transform-style: preserve-3d; transition: transform .16s ease-out; }
  .case > div { position: absolute; left: 50%; top: 50%; backface-visibility: hidden; }
  .face-front { overflow: hidden; border-radius: 3px; box-shadow: 0 30px 60px rgba(0, 0, 0, .5); }
  .face-back { background: #121214; border-radius: 3px; }
  .face-spine, .face-edge { overflow: hidden; }
  .face-edge { background: linear-gradient(90deg, #1c1c1e, #2a2a2c, #1c1c1e); }
  .face-top { background: #1a1a1c; }
  .face-spine canvas { width: 100%; height: 100%; display: block; }

  /* generated cover (no poster image) */
  .cover { position: absolute; inset: 0; color: var(--ink); background: linear-gradient(158deg, var(--c1), var(--c) 52%, var(--c2)); }
  .cover .motif { position: absolute; inset: 0; opacity: .07; }
  .cover.m0 .motif { background: radial-gradient(circle at 52% 40%, transparent 0 16%, #fff 16% 24%, transparent 24% 34%, #fff 34% 42%, transparent 42% 52%, #fff 52% 60%, transparent 60%); }
  .cover.m1 .motif { background: repeating-linear-gradient(180deg, transparent 0 9%, #fff 9% 13%); }
  .cover.m2 .motif { background: repeating-linear-gradient(64deg, transparent 0 7%, #fff 7% 11%); }
  .cover.light { color: #16120b; }
  .cover.light .motif { filter: invert(1); }
  .cover .no { position: absolute; left: 7%; top: 5.5%; font: 700 clamp(11px, 1.15vw, 15px)/1 var(--sans); letter-spacing: .18em; opacity: .8; }
  .cover .ttl { position: absolute; left: 8%; right: 8%; top: 30%; font: 700 var(--fs, 44px)/1.18 var(--serif); word-break: keep-all; overflow-wrap: anywhere; text-wrap: balance; }
  .cover .org { position: absolute; left: 8%; right: 8%; bottom: 13%; font: 500 italic clamp(12px, 1.2vw, 17px)/1.35 Georgia, serif; opacity: .82; }
  .cover .yr { position: absolute; left: 8%; bottom: 6%; font: 700 clamp(10px, .9vw, 13px)/1 var(--sans); letter-spacing: .3em; opacity: .7; }

  .tcard { position: relative; z-index: 4; width: 330px; padding: 14px 18px 15px; border-radius: 14px; background: rgba(16, 16, 18, .86); border: 1px solid var(--glass-line); }
  .tcard .t { margin: 8px 0 6px; font: 700 21px/1.28 var(--sans); }
  .arrow { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--glass-line); background: rgba(20, 20, 22, .72); color: var(--ink); display: grid; place-items: center; cursor: pointer; flex: 0 0 auto; padding: 0; }
  .arrow:hover { background: rgba(50, 50, 54, .85); }
  .arrow svg { width: 20px; height: 20px; }
  .close { position: absolute; top: 18px; right: 20px; z-index: 2; }
  .pill { display: none; position: fixed; top: 14px; right: 16px; z-index: 3; height: 44px; padding: 0 18px; align-items: center; border-radius: 22px; background: rgba(20, 20, 22, .78); border: 1px solid var(--glass-line); color: var(--ink); font: 700 15px/1 var(--sans); text-decoration: none; }
  #inspect.open ~ footer { background: rgba(5, 5, 6, .92); }
  #zoom { position: fixed; right: 16px; bottom: calc(64px + env(safe-area-inset-bottom)); z-index: 10; }
  #zoom.on { background: var(--cream); color: #111; }
  .mid { display: flex; align-items: center; gap: 22px; }

  @media (max-width: 1180px) and (min-width: 761px) {
    .panel { width: 300px; padding: 24px 22px; }
    .layout { gap: 14px; padding: 24px 20px 56px; }
    .mid { gap: 12px; }
  }
  /* phone: one scrolling column */
  @media (max-width: 760px) {
    #inspect { overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .layout { position: relative; inset: auto; min-height: 100%; flex-direction: column; justify-content: flex-start; gap: 18px; padding: 72px 0 96px; }
    .stage { order: 1; width: 100%; gap: 18px; }
    .left { order: 2; }
    .right { display: none; }
    .panel { width: calc(100% - 32px); padding: 24px 20px; border-radius: 18px; }
    .mid { gap: 0; }
    .mid .arrow { position: absolute; top: auto; bottom: 26px; z-index: 3; width: 40px; height: 40px; background: transparent; border: 0; color: var(--ink-2); }
    .mid .prev { left: 6px; } .mid .next { right: 6px; }
    .tcard { width: 100%; padding: 0 56px; text-align: center; background: none; border: 0; }
    .tcard .t { font-size: 24px; margin: 0 0 6px; }
    .tcard .badge { margin-top: 10px; }
    .tcard { display: flex; flex-direction: column; align-items: center; }
    .tcard .badge { order: 3; }
    .close { position: fixed; top: 14px; left: 16px; right: auto; }
    .pill { display: flex; }
    #card { bottom: calc(66px + env(safe-area-inset-bottom)); left: 16px; right: 76px; min-width: 0; max-width: none; transform: translateY(12px); }
    #card.show { transform: none; }
  }
</style>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- data ----------
let FILMS = [];
try {
  const r = await fetch('films.json', { cache: 'no-cache' });
  if (!r.ok) throw new Error(r.status);
  FILMS = await r.json();
} catch (e) { document.getElementById('msg').style.display = 'block'; }

const TOUCH = matchMedia('(pointer: coarse)').matches;
const fontsReady = Promise.race([
  Promise.all([
    document.fonts.load('700 30px "Noto Serif KR"', FILMS.map(f => f.title).join('') || '가'),
    document.fonts.load('700 20px "Noto Sans KR"', '가'),
  ]),
  new Promise(r => setTimeout(r, 3000)),
]).catch(() => {});

// ---------- room dimensions (metres) ----------
const RX = 0.85, RZ = 0.75, H = 2.40;
const ROWS = 10, Y0 = 0.16, DY = 0.215;
const BH = 0.185, BD = 0.135, SW = 0.0265, GAP = 0.018;
const EYE = 1.36;
const rowY = (r) => Y0 + (ROWS - 1 - r) * DY;            // r = 0 top shelf
const EYE_ROW = ROWS - 1 - Math.floor((EYE - Y0) / DY);  // row holding eye height
const SPINE_OUT = GAP + BD;                               // spine face distance from wall
const SIDE_Z0 = -RZ + SPINE_OUT + 0.06;                   // side walls stop just before the back wall's spines

const V = (x, y, z) => new THREE.Vector3(x, y, z);
const UP = V(0, 1, 0);
// walls in reading order, u = left→right as seen from inside, n = into room
const WALLS = [
  { name: 'left',  o: V(-RX, 0, RZ),      u: V(0, 0, -1), n: V(1, 0, 0),  len: RZ - SIDE_Z0 },
  { name: 'back',  o: V(-RX + .005, 0, -RZ), u: V(1, 0, 0),  n: V(0, 0, 1),  len: 2 * RX - .01 },
  { name: 'right', o: V(RX, 0, SIDE_Z0),  u: V(0, 0, 1),  n: V(-1, 0, 0), len: RZ - SIDE_Z0 },
];

// ---------- fake catalogue ----------
let seed = 20260;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const pick = (a) => a[Math.floor(rnd() * a.length)];
const ADJ = ['SILENT','LAST','LONG','RED','PALE','HIDDEN','BURNING','QUIET','LOST','WILD','GOLDEN','BITTER','EMPTY','DISTANT','BROKEN','SECRET','WINTER','SUMMER','NAKED','STRANGE','LONELY','FALLEN','DARK','BRIGHT','HOLLOW','CRIMSON','GENTLE','ENDLESS','SLEEPING','WANDERING','ELECTRIC','FORGOTTEN','PAPER','IRON','GLASS','NORTHERN','MIDNIGHT','RESTLESS','TENDER','SAVAGE'];
const NOUN = ['HARBOR','RIVER','CITY','GARDEN','MIRROR','STRANGER','WIDOW','HOUR','ISLAND','STATION','LETTER','FACE','ROAD','SHADOW','SEASON','ORCHARD','CIRCUS','KINGDOM','BRIDGE','VILLAGE','DESERT','HOTEL','LIGHTHOUSE','SAINT','THIEF','DANCER','WITNESS','PROMISE','FORTUNE','MOUNTAIN','SKY','TRAIN','CROWN','STORM','EMPIRE','FEVER','SIGNAL','DREAM','PASSAGE','HEART','MACHINE','DOLL','WOLF','ANGEL','EXILE','TIDE','VOICE','MASK','BALLAD','SONATA'];
const PLACE = ['PARIS','TOKYO','LISBON','HAVANA','ROME','BERLIN','CAIRO','SEOUL','VENICE','MANILA','TANGIER','PRAGUE','DUBLIN','MARSEILLE','KYOTO','OSLO','NAPLES','ATHENS'];
function fakeTitle() {
  const k = rnd();
  if (k < .22) return `THE ${pick(ADJ)} ${pick(NOUN)}`;
  if (k < .38) return `${pick(NOUN)} OF THE ${pick(NOUN)}`;
  if (k < .50) return `${pick(ADJ)} ${pick(NOUN)}`;
  if (k < .60) return `A ${pick(NOUN)} IN ${pick(PLACE)}`;
  if (k < .70) return `${pick(NOUN)}S`;
  if (k < .78) return `THE ${pick(NOUN)}`;
  if (k < .86) return `${pick(PLACE)}, ${pick(ADJ)}`;
  if (k < .93) return `${pick(ADJ)} ${pick(NOUN)}, ${pick(ADJ)} ${pick(NOUN)}`;
  return `${pick(NOUN)} AND ${pick(NOUN)}`;
}
const PALETTE = ['#e9e4d6','#efebe0','#e3dcc7','#d9d2bf','#f1eee6','#ddd6c4','#1c1c1f','#232326','#2b2b30','#151517','#7d1f1f','#9c3d24','#b5651d','#caa028','#5c6b32','#33564a','#1f5f63','#2a4d7a','#34357a','#5a2d6b','#7a2350','#a52a4a','#2b2b30','#46433c','#6b6256','#8a8473','#c9bfa6','#e3dcc7','#13322b','#0e2a40','#3a1f1f','#5b3a1e','#704214','#244022','#7b1538','#403a5a','#274c43','#8c5a2b','#b08d57','#d4cdb8','#ece6d6','#f2eee4','#1b1b1e','#e8e1cf','#d8d1bd','#c63b2a','#1f3f6e','#d2782a','#e2c23c'];
const lum = (hex) => { const n = parseInt(hex.slice(1), 16); return (0.2126 * (n >> 16 & 255) + 0.7152 * (n >> 8 & 255) + 0.0722 * (n & 255)) / 255; };

// ---------- lay out every slot ----------
const books = [];      // {wall, row, s (centre offset along wall), w, film?, num, title, color}
const FILM_SLOT0 = 10; // first slot index of my films on the back wall eye-level row
let num = 21;
for (let r = 0; r < ROWS; r++) {
  for (const wall of WALLS) {
    const n = Math.floor(wall.len / SW);
    const lead = (wall.len - n * SW) / 2;
    let i = 0;
    while (i < n) {
      const isFilmRow = wall.name === 'back' && r === EYE_ROW;
      if (isFilmRow && i >= FILM_SLOT0 && i < FILM_SLOT0 + 20) {
        const f = FILMS[i - FILM_SLOT0];
        if (f) { books.push({ wall, row: r, s: lead + (i + .5) * SW, w: SW, film: f, num: f.id, title: f.title, color: f.color }); i++; continue; }
      }
      const box = !isFilmRow && i < n - 1 && rnd() < .05;
      const w = box ? SW * 2 : SW;
      books.push({ wall, row: r, s: lead + i * SW + w / 2, w, num: num++, title: fakeTitle(), color: pick(PALETTE), box });
      i += box ? 2 : 1;
    }
  }
}

// ---------- spine label painter (designed at 76×540, scaled into any cell) ----------
function roundRect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function paintSpine(c, x, y, w, h, b) {
  const DW = b.box ? 152 : 76, DH = 540;
  c.save(); c.translate(x, y); c.scale(w / DW, h / DH);
  const light = lum(b.color) > .52;
  const ink = light ? '#1a160f' : '#f5f1e6', soft = light ? 'rgba(26,22,15,.7)' : 'rgba(245,241,230,.75)';
  c.fillStyle = b.color; c.fillRect(0, 0, DW, DH);
  const g = c.createLinearGradient(0, 0, DW, 0);
  g.addColorStop(0, 'rgba(0,0,0,.38)'); g.addColorStop(.12, 'rgba(0,0,0,.05)'); g.addColorStop(.45, 'rgba(255,255,255,.10)');
  g.addColorStop(.62, 'rgba(255,255,255,.04)'); g.addColorStop(.88, 'rgba(0,0,0,.10)'); g.addColorStop(1, 'rgba(0,0,0,.42)');
  c.fillStyle = g; c.fillRect(0, 0, DW, DH);
  const vg = c.createLinearGradient(0, 0, 0, DH);
  vg.addColorStop(0, 'rgba(0,0,0,.42)'); vg.addColorStop(.09, 'rgba(0,0,0,0)'); vg.addColorStop(.94, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.28)');
  c.fillStyle = vg; c.fillRect(0, 0, DW, DH);
  // number plate
  roundRect(c, 12, 16, DW - 24, 64, 6); c.fillStyle = ink; c.fill();
  const ns = String(b.num);
  c.fillStyle = b.color; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = `700 ${ns.length > 3 ? 29 : 38}px "Helvetica Neue", Arial, sans-serif`;
  c.fillText(ns, DW / 2, 49);
  // bottom mark
  const ly = DH - 48;
  if (b.film) {
    c.fillStyle = soft; c.font = '700 17px "Helvetica Neue", Arial, sans-serif'; c.fillText('2026', DW / 2, ly + 6);
  } else {

zoomBtn.onclick = () => { const on = fov > 50; fov = on ? 30 : 72; zoomBtn.classList.toggle('on', on); zoomBtn.setAttribute('aria-pressed', on); dirty = true; };
// ---------- loop ----------
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight, false);

});
let lastCenterKey = '';
function frame() {
  requestAnimationFrame(frame);
  if (!ptrs.size && (Math.abs(vYaw) > 1e-5 || Math.abs(vPitch) > 1e-5)) { yaw += vYaw; pitch += vPitch; vYaw *= .92; vPitch *= .92; dirty = true; }
  for (const m of filmMeshes) {
    const d = m.userData;
    if (Math.abs(d.pop - d.target) > 1e-5) {

    }
  }

}

frame();
